site_name: South Hills Modding Club Guide
copyright: Copyright &copy; YGLEDC — South Hills Modding Club

theme:
  name: material
  logo: assets/club-logo/emblem-transparent.png
  favicon: assets/club-logo/emblem-transparent.png
  features:
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: white
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/diagram-zoom.js
  - javascripts/search-preview.js
  - javascripts/search-jump.js

nav:
  - Home: index.md
  - Foreword: foreword.md

  - Introduction:
      - Overview: 01-introduction/index.md
      - Guide Handbook: 01-introduction/01-guide-handbook.md
      - Java: 01-introduction/02-java.md
      - Minecraft: 01-introduction/03-minecraft.md
      - GitHub & Version Control: 01-introduction/04-github-version-control.md

  - Setup:
      - Overview: 02-setup/index.md
      - Minecraft & Launcher: 02-setup/01-minecraft-launcher.md
      - JDK Install: 02-setup/02-jdk-install.md
      - IntelliJ Install: 02-setup/03-intellij-install.md
      - Template Mod Generator: 02-setup/04-template-mod-generator.md

  - Activities:
      - Overview: 03-activities/index.md
      - "Act 1: Item": 03-activities/01-item.md
      - "Act 2: Item Features 01": 03-activities/02-item-features-01.md
      - "Act 3: Block": 03-activities/03-block.md
      - "Act 4: World Gen, Loot Tables & Recipes": 03-activities/04-world-gen-loot-tables-recipes.md
      - "Act 5: Entity - Mob": 03-activities/05-entity-mob.md

  - Dictionary:
      - Overview: 04-dictionary/index.md
      - Java Knowledge: 04-dictionary/01-java-knowledge.md
      - JSON Knowledge: 04-dictionary/02-json-knowledge.md
      - Modding Reference:
          - Overview: 04-dictionary/modding-reference/index.md
          - Minecraft Facts: 04-dictionary/modding-reference/minecraft-facts.md
          - Status Effects: 04-dictionary/modding-reference/status-effects.md
      - Activity Templates:
          - Overview: 04-dictionary/activity-templates/index.md
          - Act 1 Template: 04-dictionary/activity-templates/act-1-template.md
          - Act 2 Template: 04-dictionary/activity-templates/act-2-template.md
          - Act 3 Template: 04-dictionary/activity-templates/act-3-template.md
          - Act 4 Template: 04-dictionary/activity-templates/act-4-template.md

  - Helpful Links:
      - Overview: 05-helpful-links/index.md

  - Credits:
      - Overview: 06-credits/index.md
      - Third-Party Resources: 06-credits/01-third-party-resources.md
      - Club Artist Contributions: 06-credits/02-club-artist-contributions.md

  - FAQ:
      - Overview: 07-faq/index.md

  - Mods:
      - Mods Directory: 08-mods/index.md

  - Project Cases:
      - Overview: 09-project-cases/index.md
