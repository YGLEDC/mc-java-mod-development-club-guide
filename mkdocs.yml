site_name: South Hills Modding Club Guide
copyright: Copyright &copy; YGLEDC — South Hills Modding Club

theme:
  name: material
  logo: assets/club-logo/emblem-transparent.png
  favicon: assets/club-logo/emblem-transparent.png
  features:
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: white
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/diagram-zoom.js

nav:
  - Home: index.md
  - Foreword: foreword.md

  - Introduction:
      - Introduction Overview: 01-introduction/index.md
      - Guide Handbook: 01-introduction/01-guide-handbook.md
      - Java: 01-introduction/02-java.md
      - Minecraft: 01-introduction/03-minecraft.md
      - GitHub & Version Control: 01-introduction/04-github-version-control.md

  - Setup:
      - Setup Overview: 02-setup/index.md

  - Activities:
      - Activities Overview: 03-activities/index.md
      - "Act 1: Item": 03-activities/01-item.md
      - "Act 2: Block": 03-activities/02-block.md
      - "Act 3: Tool": 03-activities/03-tool.md
      - "Act 4: Entity - Mob": 03-activities/04-entity-mob.md

  - Dictionary:
      - Dictionary Home: 04-dictionary/index.md

  - Helpful Links:
      - Helpful Links Home: 05-helpful-links/index.md

  - FAQ:
      - FAQ Home: 06-faq/index.md

  - Mods:
      - Mods Directory: 07-mods/index.md

  - Project Cases:
      - Project Cases Overview: 08-project-cases/index.md
